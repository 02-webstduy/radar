<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14110f" />
    <title>画像 · 技术雷达</title>
    <style>
      :root { --bg:#14110f; --panel:#1d1916; --line:#302822; --text:#f0e7dd; --muted:#a3958a; --accent:#e8a86a; }
      * { box-sizing: border-box; }
      body {
        margin:0; background:radial-gradient(120% 60% at 50% -10%, #241b15 0, transparent 60%), var(--bg);
        color:var(--text); font:15px/1.7 ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
        max-width:760px; margin:0 auto; padding:20px 16px 60px;
      }
      header { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
      h1 { font-size:17px; margin:0; flex:1; }
      .link { color:var(--muted); font-size:12px; text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:4px 10px; }
      .link:hover { color:var(--text); }
      .sub { color:var(--muted); font-size:12.5px; margin:0 0 14px; }
      .msg { display:flex; margin:8px 0; }
      .msg.user { justify-content:flex-end; }
      .bubble { max-width:82%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; }
      .msg.ai .bubble { background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:5px; }
      .msg.user .bubble { background:#3a2b1e; border-bottom-right-radius:5px; }
      .msg.sys .bubble { background:transparent; border:1px dashed var(--line); color:var(--muted); font-size:12.5px; }
      .msg.sys { justify-content:center; }
      .thinking::after { content:"···"; color:var(--muted); letter-spacing:2px; }
      .row { display:flex; gap:8px; margin-top:10px; }
      input, textarea {
        flex:1; background:var(--bg); color:var(--text); border:1px solid var(--line);
        border-radius:12px; padding:10px 12px; font:inherit; outline:none; width:100%;
      }
      input:focus, textarea:focus { border-color:#57483c; }
      button.primary { background:var(--accent); color:#2a1c10; border:none; border-radius:12px; padding:10px 16px; font:inherit; font-weight:600; cursor:pointer; }
      button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:12px; padding:8px 12px; font:inherit; font-size:13px; cursor:pointer; }
      .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:12px; }
      .field { margin:12px 0; }
      .field-head { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
      .field-head label { font-size:12px; color:var(--muted); }
      .badge { font-size:10.5px; border-radius:999px; padding:1px 7px; border:1px solid var(--line); color:var(--muted); }
      .badge.hi { color:#7fbf8a; border-color:#3f5a44; }
      .badge.mid { color:#e0b072; border-color:#5a4a35; }
      .ev { font-size:11.5px; color:#8f8176; margin-top:4px; }
      .ok { color:#7fbf8a; font-size:13px; margin-top:8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>画像</h1>
      <a class="link" href="/">回到雷达</a>
      <button class="ghost" id="mode-btn" type="button">直接填表</button>
    </header>
    <p class="sub" id="sub">随便聊，AI 会从对话里整理画像；不对可以改。</p>

    <div id="chat"></div>
    <div id="dock"></div>
    <div id="draft"></div>

    <script>
      const chat = document.getElementById("chat");
      const dock = document.getElementById("dock");
      const draftBox = document.getElementById("draft");
      const sub = document.getElementById("sub");
      const modeBtn = document.getElementById("mode-btn");

      let chatId = null;
      let questions = [];
      let busy = false;

      function bubble(role, text) {
        const row = document.createElement("div");
        row.className = "msg " + role;
        const b = document.createElement("div");
        b.className = "bubble";
        b.textContent = text;
        row.appendChild(b);
        chat.appendChild(row);
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
        return b;
      }

      function system(text) { bubble("sys", text); }

      async function post(url, body) {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {}),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || `请求失败（${res.status}）`);
        return data;
      }

      function addComposer() {
        dock.replaceChildren();
        const row = document.createElement("div");
        row.className = "row";
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = "像聊天一样说就行…";
        const send = document.createElement("button");
        send.className = "primary";
        send.textContent = "发送";
        const summarize = document.createElement("button");
        summarize.className = "ghost";
        summarize.textContent = "生成画像";
        summarize.addEventListener("click", () => makeDraft());

        async function submit() {
          const text = input.value.trim();
          if (!text || busy) return;
          input.value = "";
          await sendText(text);
        }
        send.addEventListener("click", submit);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); submit(); }
        });
        row.append(input, send, summarize);
        dock.appendChild(row);
        input.focus();
      }

      async function sendText(text) {
        if (!chatId) return;
        busy = true;
        bubble("user", text);
        const thinking = bubble("ai", "");
        thinking.classList.add("thinking");
        try {
          const data = await post("/api/profile/chat/send", { id: chatId, text });
          thinking.classList.remove("thinking");
          thinking.textContent = data.reply || "";
          if (data.ready && data.draft) showDraft(data.draft);
        } catch (err) {
          thinking.classList.remove("thinking");
          thinking.textContent = "";
          thinking.parentElement.remove();
          system(err.message);
        } finally {
          busy = false;
        }
      }

      async function startChat() {
        chat.replaceChildren();
        draftBox.replaceChildren();
        const data = await post("/api/profile/chat/start");
        chatId = data.id;
        bubble("ai", data.reply);
        addComposer();
      }

      async function makeDraft() {
        if (!chatId || busy) return;
        busy = true;
        system("正在整理画像…");
        try {
          const data = await post("/api/profile/draft", { id: chatId });
          showDraft(data);
        } catch (err) {
          system(err.message);
        } finally {
          busy = false;
        }
      }

      function showDraft(data) {
        draftBox.replaceChildren();
        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("p");
        title.textContent = "这是我从对话里读到的你。数字是置信度，字段可以直接改。";
        title.style.margin = "0 0 4px";
        card.appendChild(title);

        const draft = { ...(data.facts || {}) };
        const conf = data.confidence || {};
        const ev = data.evidence || {};

        for (const q of questions) {
          const wrap = document.createElement("div");
          wrap.className = "field";
          const head = document.createElement("div");
          head.className = "field-head";
          const lb = document.createElement("label");
          lb.textContent = q.text.replace(/（.*?）/g, "");
          const badge = document.createElement("span");
          const c = conf[q.key] || 0;
          badge.className = "badge " + (c >= 0.8 ? "hi" : c >= 0.5 ? "mid" : "");
          badge.textContent = c ? `置信度 ${c}` : (draft[q.key] ? "已有" : "未提到");
          head.append(lb, badge);

          const input = document.createElement("input");
          input.type = "text";
          input.value = draft[q.key] || "";
          input.addEventListener("input", () => { draft[q.key] = input.value; });

          const evEl = document.createElement("div");
          evEl.className = "ev";
          evEl.textContent = ev[q.key] ? "依据：" + ev[q.key] : "";

          wrap.append(head, input, evEl);
          card.appendChild(wrap);
        }

        const narrWrap = document.createElement("div");
        narrWrap.className = "field";
        const nl = document.createElement("label");
        nl.textContent = "一段自述";
        const ta = document.createElement("textarea");
        ta.rows = 3;
        ta.value = data.narrative || "";
        narrWrap.append(nl, ta);
        card.appendChild(narrWrap);

        const row = document.createElement("div");
        row.className = "row";
        const save = document.createElement("button");
        save.className = "primary";
        save.textContent = "保存画像";
        save.addEventListener("click", async () => {
          try {
            await post("/api/profile/save", { facts: draft, narrative: ta.value });
            const ok = document.createElement("p");
            ok.className = "ok";
            ok.textContent = "已保存。回雷达页看今天的 8 条。";
            card.appendChild(ok);
          } catch (err) {
            system(err.message);
          }
        });
        const again = document.createElement("button");
        again.className = "ghost";
        again.textContent = "重新聊";
        again.addEventListener("click", () => { startChat(); });
        row.append(save, again);
        card.appendChild(row);

        draftBox.appendChild(card);
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      }

      function renderForm() {
        chat.replaceChildren();
        draftBox.replaceChildren();
        sub.textContent = "直接填，保存后随时可以回来改。";
        const card = document.createElement("div");
        card.className = "card";
        const draft = {};
        for (const q of questions) {
          const wrap = document.createElement("div");
          wrap.className = "field";
          const lb = document.createElement("label");
          lb.textContent = q.text.replace(/（.*?）/g, "");
          const input = document.createElement("input");
          input.type = "text";
          input.placeholder = (q.options || []).join(" / ");
          input.addEventListener("input", () => { draft[q.key] = input.value; });
          wrap.append(lb, input);
          card.appendChild(wrap);
        }
        const row = document.createElement("div");
        row.className = "row";
        const save = document.createElement("button");
        save.className = "primary";
        save.textContent = "保存";
        save.addEventListener("click", async () => {
          try {
            await post("/api/profile/save", { facts: draft, narrative: "" });
            const ok = document.createElement("p");
            ok.className = "ok";
            ok.textContent = "已保存。";
            card.appendChild(ok);
          } catch (err) { system(err.message); }
        });
        row.appendChild(save);
        card.appendChild(row);
        draftBox.appendChild(card);
      }

      modeBtn.addEventListener("click", async () => {
        if (modeBtn.textContent === "直接填表") {
          modeBtn.textContent = "回到聊天";
          renderForm();
        } else {
          modeBtn.textContent = "直接填表";
          await startChat();
        }
      });

      async function init() {
        const res = await fetch("/api/profile");
        const data = await res.json();
        questions = data.questions || [];
        if (data.facts && Object.keys(data.facts).length) {
          sub.textContent = "已有画像；可以重新聊，也可以直接改。";
          showDraft({
            facts: data.facts,
            confidence: {},
            evidence: {},
            narrative: data.narrative,
          });
        } else {
          await startChat();
        }
      }

      init();
    </script>
  </body>
</html>

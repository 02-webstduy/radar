<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14110f" />
    <title>画像 · 技术雷达</title>
    <style>
      :root { --bg:#14110f; --panel:#1d1916; --line:#302822; --text:#f0e7dd; --muted:#a3958a; --accent:#e8a86a; }
      * { box-sizing: border-box; }
      body {
        margin:0; background:radial-gradient(120% 60% at 50% -10%, #241b15 0, transparent 60%), var(--bg);
        color:var(--text); font:15px/1.7 ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
        max-width:760px; margin:0 auto; padding:20px 16px 60px;
      }
      header { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
      h1 { font-size:17px; margin:0; flex:1; }
      .link { color:var(--muted); font-size:12px; text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:4px 10px; }
      .link:hover { color:var(--text); }
      .sub { color:var(--muted); font-size:12.5px; margin:0 0 14px; }
      .bar { height:3px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:16px; }
      .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .25s ease; }
      .msg { display:flex; margin:8px 0; }
      .msg.user { justify-content:flex-end; }
      .bubble { max-width:82%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; }
      .msg.ai .bubble { background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:5px; }
      .msg.user .bubble { background:#3a2b1e; border-bottom-right-radius:5px; }
      .hint { color:var(--muted); font-size:12px; margin-top:4px; }
      .chips { display:flex; flex-wrap:wrap; gap:7px; margin:10px 0; }
      .chip { border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:999px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer; }
      .chip[aria-pressed="true"] { background:var(--accent); color:#2a1c10; border-color:var(--accent); }
      .row { display:flex; gap:8px; margin-top:10px; }
      input[type="text"], textarea {
        flex:1; background:var(--bg); color:var(--text); border:1px solid var(--line);
        border-radius:12px; padding:10px 12px; font:inherit; outline:none;
      }
      input[type="text"]:focus, textarea:focus { border-color:#57483c; }
      button.primary { background:var(--accent); color:#2a1c10; border:none; border-radius:12px; padding:10px 16px; font:inherit; font-weight:600; cursor:pointer; }
      button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:12px; padding:8px 12px; font:inherit; font-size:13px; cursor:pointer; }
      .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:12px; }
      .field { margin:10px 0; }
      .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
      .field input, .field textarea { width:100%; }
      .ok { color:#7fbf8a; font-size:13px; }
      .hidden { display:none; }
    </style>
  </head>
  <body>
    <header>
      <h1>画像</h1>
      <a class="link" href="/">回到雷达</a>
      <button class="ghost" id="mode-btn" type="button">直接填表</button>
    </header>
    <p class="sub" id="sub">8 个问题，约 3 分钟；答完可以改。</p>
    <div class="bar"><i id="bar"></i></div>

    <div id="chat"></div>
    <div id="dock"></div>
    <div id="summary"></div>

    <script>
      const chat = document.getElementById("chat");
      const dock = document.getElementById("dock");
      const summary = document.getElementById("summary");
      const bar = document.getElementById("bar");
      const sub = document.getElementById("sub");
      const modeBtn = document.getElementById("mode-btn");

      let questions = [];
      let session = null;
      let current = null;
      let selected = new Set();
      let mode = "chat";

      function bubble(role, text) {
        const row = document.createElement("div");
        row.className = "msg " + (role === "user" ? "user" : "ai");
        const b = document.createElement("div");
        b.className = "bubble";
        b.textContent = text;
        row.appendChild(b);
        chat.appendChild(row);
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
        return b;
      }

      function setProgress(step, total) {
        bar.style.width = total ? `${Math.round((step / total) * 100)}%` : "0";
      }

      function clearDock() { dock.replaceChildren(); }

      function addOptions(q) {
        const chips = document.createElement("div");
        chips.className = "chips";
        for (const opt of q.options || []) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = opt;
          b.setAttribute("aria-pressed", String(selected.has(opt)));
          b.addEventListener("click", () => {
            if (q.multi) {
              selected.has(opt) ? selected.delete(opt) : selected.add(opt);
              b.setAttribute("aria-pressed", String(selected.has(opt)));
            } else {
              submit(opt);
            }
          });
          chips.appendChild(b);
        }
        dock.appendChild(chips);
      }

      function addComposer(q) {
        const row = document.createElement("div");
        row.className = "row";
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = q.multi ? "也可以自己补，用逗号分隔" : "也可以直接打字";
        const send = document.createElement("button");
        send.className = "primary";
        send.textContent = q.multi ? "下一题" : "发送";
        send.addEventListener("click", () => {
          const typed = input.value.trim();
          if (q.multi) {
            const values = [...selected];
            if (typed) values.push(...typed.split(/[,，]/).map((s) => s.trim()).filter(Boolean));
            submit(values.join(", "));
          } else if (typed) {
            submit(typed);
          }
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); send.click(); }
        });
        row.append(input, send);
        dock.appendChild(row);
        input.focus();
      }

      async function submit(answer) {
        if (!answer) return;
        bubble("user", answer);
        clearDock();
        const res = await fetch("/api/profile/chat/answer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: session, answer }),
        });
        const data = await res.json();
        if (data.done) {
          showSummary(data.facts, data.narrative);
          return;
        }
        renderQuestion(data);
      }

      function renderQuestion(data) {
        current = data;
        selected = new Set();
        const q = data.question;
        const b = bubble("ai", q.text);
        if (q.hint) {
          const h = document.createElement("div");
          h.className = "hint";
          h.textContent = q.hint;
          b.appendChild(h);
        }
        sub.textContent = `第 ${data.step} / ${data.total} 题 · 答完可以改`;
        setProgress(data.step, data.total);
        clearDock();
        addOptions(q);
        addComposer(q);
      }

      async function startChat() {
        chat.replaceChildren();
        summary.replaceChildren();
        const res = await fetch("/api/profile/chat/start", { method: "POST" });
        const data = await res.json();
        session = data.id;
        renderQuestion(data);
      }

      function showSummary(facts, narrative) {
        mode = "summary";
        clearDock();
        setProgress(1, 1);
        sub.textContent = "这是它理解的你；不对就直接改，改完保存。";
        summary.replaceChildren();
        const card = document.createElement("div");
        card.className = "card";
        const fields = [
          ["goal", "目标"], ["project", "当前项目"], ["stack", "会的"],
          ["learning", "在学"], ["hours", "每周小时"], ["interests", "想多看"],
          ["avoid", "不想看"], ["format", "偏好"],
        ];
        const draft = { ...facts };
        for (const [key, label] of fields) {
          const wrap = document.createElement("div");
          wrap.className = "field";
          const lb = document.createElement("label");
          lb.textContent = label;
          const inp = document.createElement("input");
          inp.type = "text";
          inp.value = draft[key] || "";
          inp.addEventListener("input", () => { draft[key] = inp.value; });
          wrap.append(lb, inp);
          card.appendChild(wrap);
        }
        const narrWrap = document.createElement("div");
        narrWrap.className = "field";
        const nl = document.createElement("label");
        nl.textContent = "一段自述";
        const ta = document.createElement("textarea");
        ta.rows = 3;
        ta.value = narrative || "";
        narrWrap.append(nl, ta);
        card.appendChild(narrWrap);

        const row = document.createElement("div");
        row.className = "row";
        const save = document.createElement("button");
        save.className = "primary";
        save.textContent = "保存画像";
        const again = document.createElement("button");
        again.className = "ghost";
        again.textContent = "重新聊";
        again.addEventListener("click", startChat);
        save.addEventListener("click", async () => {
          const res = await fetch("/api/profile/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ facts: draft, narrative: ta.value }),
          });
          if (res.ok) {
            const msg = document.createElement("p");
            msg.className = "ok";
            msg.textContent = "已保存。去雷达页看看今天的 8 条。";
            card.appendChild(msg);
          }
        });
        row.append(save, again);
        card.appendChild(row);
        summary.appendChild(card);
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      }

      function renderForm() {
        mode = "form";
        chat.replaceChildren();
        summary.replaceChildren();
        clearDock();
        setProgress(1, 1);
        sub.textContent = "直接填，保存后随时可以回来改。";
        const card = document.createElement("div");
        card.className = "card";
        const draft = {};
        for (const q of questions) {
          const wrap = document.createElement("div");
          wrap.className = "field";
          const lb = document.createElement("label");
          lb.textContent = q.text.replace(/（.*?）/g, "");
          const inp = document.createElement("input");
          inp.type = "text";
          inp.placeholder = (q.options || []).join(" / ");
          inp.addEventListener("input", () => { draft[q.key] = inp.value; });
          wrap.append(lb, inp);
          card.appendChild(wrap);
        }
        const row = document.createElement("div");
        row.className = "row";
        const save = document.createElement("button");
        save.className = "primary";
        save.textContent = "保存";
        save.addEventListener("click", async () => {
          const res = await fetch("/api/profile/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ facts: draft, narrative: "" }),
          });
          if (res.ok) {
            const msg = document.createElement("p");
            msg.className = "ok";
            msg.textContent = "已保存。";
            card.appendChild(msg);
          }
        });
        row.appendChild(save);
        card.appendChild(row);
        summary.appendChild(card);
      }

      modeBtn.addEventListener("click", () => {
        if (mode === "form") { mode = "chat"; startChat(); }
        else { renderForm(); }
        modeBtn.textContent = mode === "form" ? "回到聊天" : "直接填表";
      });

      async function init() {
        const res = await fetch("/api/profile");
        const data = await res.json();
        questions = data.questions || [];
        if (data.facts && Object.keys(data.facts).length) {
          showSummary(data.facts, data.narrative);
          modeBtn.textContent = "重新聊";
        } else {
          await startChat();
        }
      }

      init();
    </script>
  </body>
</html>

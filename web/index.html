<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14110f" />
    <title>技术雷达</title>
    <style>
      :root {
        --bg: #14110f; --panel: #1d1916; --line: #302822;
        --text: #f0e7dd; --muted: #a3958a; --accent: #e8a86a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 15px/1.7 ui-sans-serif, -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        max-width: 720px; margin: 0 auto; padding: 20px 16px 60px;
      }
      header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
      h1 { font-size: 18px; margin: 0; }
      #meta { color: var(--muted); font-size: 12px; flex: 1; }
      button {
        background: transparent; border: 1px solid var(--line); color: var(--muted);
        border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer;
      }
      .card {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
      }
      .card a.title { color: var(--text); text-decoration: none; font-weight: 600; }
      .card a.title:hover { color: var(--accent); }
      .tags { margin: 6px 0 2px; display: flex; flex-wrap: wrap; gap: 6px; }
      .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
      .tag.src { color: var(--accent); border-color: #57483c; }
      .sum { color: var(--muted); font-size: 13px; margin-top: 4px; }
      .hint { color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <h1>技术雷达</h1>
      <span id="meta"></span>
      <button id="refresh">刷新</button>
    </header>
    <main id="list"><p class="hint">加载中…</p></main>
    <script>
      const list = document.getElementById("list");
      const meta = document.getElementById("meta");

      function rel(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        const h = Math.round((Date.now() - d.getTime()) / 3600000);
        if (h < 1) return "刚刚";
        if (h < 24) return h + " 小时前";
        return Math.round(h / 24) + " 天前";
      }

      async function load() {
        list.innerHTML = '<p class="hint">加载中…</p>';
        try {
          const res = await fetch("/api/items");
          const data = await res.json();
          meta.textContent = data.role + " · " + data.items.length + " 条 · " +
            (data.updated ? new Date(data.updated * 1000).toLocaleTimeString("zh-CN") : "");
          list.innerHTML = "";
          if (!data.items.length) {
            list.innerHTML = '<p class="hint">今天没有命中关键词的条目。</p>';
            return;
          }
          for (const it of data.items) {
            const card = document.createElement("article");
            card.className = "card";

            const a = document.createElement("a");
            a.className = "title"; a.href = it.url; a.target = "_blank"; a.rel = "noopener";
            a.textContent = it.title;
            card.appendChild(a);

            const tags = document.createElement("div");
            tags.className = "tags";
            const src = document.createElement("span");
            src.className = "tag src"; src.textContent = it.source;
            tags.appendChild(src);
            const when = document.createElement("span");
            when.className = "tag"; when.textContent = rel(it.published);
            tags.appendChild(when);
            for (const k of (it.matched || [])) {
              const t = document.createElement("span");
              t.className = "tag"; t.textContent = k;
              tags.appendChild(t);
            }
            card.appendChild(tags);

            if (it.summary) {
              const s = document.createElement("p");
              s.className = "sum"; s.textContent = it.summary;
              card.appendChild(s);
            }
            list.appendChild(card);
          }
        } catch (err) {
          list.innerHTML = '<p class="hint">加载失败：' + err.message + "</p>";
        }
      }

      document.getElementById("refresh").addEventListener("click", load);
      load();
    </script>
  </body>
</html>
